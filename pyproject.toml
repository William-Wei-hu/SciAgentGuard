[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sciagentguard"
version = "0.4.0.dev1"
description = "Runtime scientific contracts for detecting semantic failures in AI-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
hep = [
    "awkward>=2.8,<3",
    "numpy>=2,<2.3; python_version < '3.14'",
    "numpy>=2.4,<3; python_version >= '3.14'",
    "uproot>=5.6,<6",
]
materials = [
    "h5py>=3.16,<4",
    "numpy>=2,<2.3; python_version < '3.14'",
    "numpy>=2.4,<3; python_version >= '3.14'",
]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sciagentguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Code written by a model under evaluation is preserved verbatim as evidence. Linting it would
# hold a third party's output to this repository's style, and reformatting it would destroy the
# very artifact the experiment recorded.
extend-exclude = ["benchmarks/results/agent_code"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["awkward", "h5py", "numpy", "numpy.*", "uproot"]
follow_imports = "skip"
ignore_missing_imports = true
